[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m5-max-kernels"
version = "0.1.0"
description = "Reproducible Apple Silicon kernel performance and numerical accuracy experiments"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.4.6", "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
m5bench = "m5kernels.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m5kernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["metal: requires a real Apple Silicon Metal GPU"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
